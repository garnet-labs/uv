# Records the dependency install under the Garnet sensor on every pull request,
# Dependabot's included, and on every push to the default branch. Pull request
# runs get one Runtime Review comment per head commit. Default-branch pushes
# post no comment; they leave the base record a pull request's first recorded
# commit is compared with. Later commits compare with the previous recorded
# commit on the pull request.
name: Garnet Runtime Visibility

on:
  push:
    branches: ['main']
  pull_request:

permissions: {}

concurrency:
  group: garnet-record-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dep-install:
    name: Dependency install (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      UV_HTTP_RETRIES: 5
      RUST_BACKTRACE: 1
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare Rust and Python
        run: rustup toolchain install --profile minimal
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - name: Prepare Python interpreters
        env:
          UV_PYTHON_DOWNLOADS_JSON_URL: crates/uv-python-managed/download-metadata.json
        run: uv python install 3.10 3.12
      - name: Build selected integration binary
        run: cargo test --locked -p uv --test pip_compile --no-default-features --features test-python,test-pypi --no-run

      # OIDC exchange; pull requests from other repositories receive no token
      # and the action falls back to a local, best-effort record.
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - name: Run selected index cases
        run: cargo test --locked -p uv --test pip_compile --no-default-features --features test-python,test-pypi -- --exact --nocapture --test-threads=1 pip_compile::compile_index_url_first_match_all_versions pip_compile::compile_index_url_fallback_prefer_primary pip_compile::compile_index_url_unsafe_highest pip_compile::compile_index_url_unsafe_lowest pip_compile::emit_index_annotation_multiple_indexes pip_compile::same_version_multi_index_incompatibility

      - name: Let sensor settle
        if: always()
        run: sleep 30
